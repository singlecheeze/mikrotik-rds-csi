# Optional PVC-only test manifest. The normal benchmark workflow creates this PVC
# automatically from 07-test-pod.yaml.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rds-csi-test
  namespace: nvme-test
spec:
  storageClassName: mikrotik-rds-nvme
  accessModes:
    - ReadWriteOnce
  volumeMode: Block
  resources:
    requests:
      storage: 1Gi
