# WARNING: This pod performs destructive fio write benchmarks against the raw
# block PVC rds-csi-test. Use it only with a disposable test PVC.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rds-csi-test
  namespace: nvme-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rds-csi-test-use-privileged-scc
  namespace: nvme-test
rules:
  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints"]
    resourceNames: ["privileged"]
    verbs: ["use"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rds-csi-test-privileged
  namespace: nvme-test
subjects:
  - kind: ServiceAccount
    name: rds-csi-test
    namespace: nvme-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rds-csi-test-use-privileged-scc
---
apiVersion: v1
kind: Pod
metadata:
  name: rds-csi-test
  namespace: nvme-test
spec:
  serviceAccountName: rds-csi-test
  restartPolicy: Never
  containers:
    - name: test
      # CentOS Stream 9 provides fio from its public AppStream repository.
      image: quay.io/centos/centos:stream9
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -euxo pipefail

          DEVICE=/dev/rds-test
          BENCHMARK_RUNTIME=30
          IO_DEPTH=32

          echo "Installing fio and block-device utilities..."
          dnf -y --setopt=install_weak_deps=False install fio fio-engine-libaio util-linux
          dnf clean all

          echo "Verifying fio libaio engine..."
          if ! fio --enghelp 2>/dev/null | grep -qw libaio; then
            echo "fio libaio engine is not available after package installation." >&2
            exit 1
          fi

          echo
          echo "============================================================"
          echo " Raw block device"
          echo "============================================================"
          ls -l "${DEVICE}"

          SIZE_BYTES="$(blockdev --getsize64 "${DEVICE}")"
          SEQ_SIZE_BYTES="$((SIZE_BYTES / 1048576 * 1048576))"
          RAND_SIZE_BYTES="$((SIZE_BYTES / 4096 * 4096))"

          echo "Device size: ${SIZE_BYTES} bytes"
          echo "Sequential test size: ${SEQ_SIZE_BYTES} bytes"
          echo "Random test address space: ${RAND_SIZE_BYTES} bytes"
          echo "Benchmark runtime: ${BENCHMARK_RUNTIME} seconds per workload"
          echo "I/O depth: ${IO_DEPTH}"

          if (( SEQ_SIZE_BYTES < 1048576 )); then
            echo "Device is too small for the 1 MiB sequential benchmark." >&2
            exit 1
          fi

          if (( RAND_SIZE_BYTES < 4096 )); then
            echo "Device is too small for the 4 KiB random benchmark." >&2
            exit 1
          fi

          echo
          echo "============================================================"
          echo " 1/4 Sequential WRITE - 1 MiB blocks"
          echo "============================================================"
          fio \
            --name=seq-write \
            --filename="${DEVICE}" \
            --allow_file_create=0 \
            --rw=write \
            --bs=1M \
            --ioengine=libaio \
            --direct=1 \
            --iodepth="${IO_DEPTH}" \
            --numjobs=1 \
            --size="${SEQ_SIZE_BYTES}" \
            --time_based=1 \
            --runtime="${BENCHMARK_RUNTIME}" \
            --end_fsync=1 \
            --group_reporting \
            --eta=never \
            | tee /tmp/fio-seq-write.txt

          echo
          echo "============================================================"
          echo " 2/4 Sequential READ - 1 MiB blocks"
          echo "============================================================"
          fio \
            --name=seq-read \
            --filename="${DEVICE}" \
            --allow_file_create=0 \
            --rw=read \
            --bs=1M \
            --ioengine=libaio \
            --direct=1 \
            --iodepth="${IO_DEPTH}" \
            --numjobs=1 \
            --size="${SEQ_SIZE_BYTES}" \
            --time_based=1 \
            --runtime="${BENCHMARK_RUNTIME}" \
            --group_reporting \
            --eta=never \
            | tee /tmp/fio-seq-read.txt

          echo
          echo "============================================================"
          echo " 3/4 Random WRITE - 4 KiB blocks, ${BENCHMARK_RUNTIME}s"
          echo "============================================================"
          fio \
            --name=rand-write \
            --filename="${DEVICE}" \
            --allow_file_create=0 \
            --rw=randwrite \
            --bs=4k \
            --ioengine=libaio \
            --direct=1 \
            --iodepth="${IO_DEPTH}" \
            --numjobs=1 \
            --size="${RAND_SIZE_BYTES}" \
            --time_based=1 \
            --runtime="${BENCHMARK_RUNTIME}" \
            --end_fsync=1 \
            --group_reporting \
            --eta=never \
            | tee /tmp/fio-rand-write.txt

          echo
          echo "============================================================"
          echo " 4/4 Random READ - 4 KiB blocks, ${BENCHMARK_RUNTIME}s"
          echo "============================================================"
          fio \
            --name=rand-read \
            --filename="${DEVICE}" \
            --allow_file_create=0 \
            --rw=randread \
            --bs=4k \
            --ioengine=libaio \
            --direct=1 \
            --iodepth="${IO_DEPTH}" \
            --numjobs=1 \
            --size="${RAND_SIZE_BYTES}" \
            --time_based=1 \
            --runtime="${BENCHMARK_RUNTIME}" \
            --group_reporting \
            --eta=never \
            | tee /tmp/fio-rand-read.txt

          echo
          echo "============================================================"
          echo " fio benchmark complete"
          echo "============================================================"
          echo "Results are available in this pod's logs and under /tmp/fio-*.txt."
          echo "The pod will remain running for manual inspection of the raw device."

          sleep infinity
      securityContext:
        privileged: true
        runAsUser: 0
      volumeDevices:
        - name: disk
          devicePath: /dev/rds-test
  volumes:
    - name: disk
      persistentVolumeClaim:
        claimName: rds-csi-test
