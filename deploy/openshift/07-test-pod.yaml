# WARNING: This manifest creates a disposable raw-block PVC and performs
# destructive fio write benchmarks against it. Do not point it at a PVC that
# contains data you need to preserve.
#
# The benchmark container uses CentOS Stream 9 userspace because fio and the
# libaio engine are available from its standard repositories. The container
# shares the OpenShift node's RHCOS kernel, so NVMe/TCP kernel behavior and
# optimizations come from the node kernel rather than from the container image.
apiVersion: v1
kind: Namespace
metadata:
  name: nvme-test
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rds-csi-test
  namespace: nvme-test
spec:
  storageClassName: mikrotik-rds-nvme
  accessModes:
    - ReadWriteOnce
  volumeMode: Block
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rds-csi-test
  namespace: nvme-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rds-csi-test-use-privileged-scc
  namespace: nvme-test
rules:
  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints"]
    resourceNames: ["privileged"]
    verbs: ["use"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rds-csi-test-privileged
  namespace: nvme-test
subjects:
  - kind: ServiceAccount
    name: rds-csi-test
    namespace: nvme-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rds-csi-test-use-privileged-scc
---
apiVersion: v1
kind: Pod
metadata:
  name: rds-csi-test
  namespace: nvme-test
spec:
  serviceAccountName: rds-csi-test
  restartPolicy: Never
  containers:
    - name: test
      image: quay.io/centos/centos:stream9
      imagePullPolicy: Always
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -euo pipefail

          DEVICE=/dev/rds-test
          BENCHMARK_RUNTIME=30
          IO_DEPTH=32

          printf 'Installing benchmark tools...\n'
          if ! dnf -y -q --setopt=install_weak_deps=False install \
              fio fio-engine-libaio util-linux \
              >/tmp/dnf-install.log 2>&1; then
            cat /tmp/dnf-install.log >&2
            exit 1
          fi
          dnf -q clean all >/dev/null 2>&1 || true

          if ! fio --enghelp 2>/dev/null | grep -qw libaio; then
            printf 'ERROR: fio libaio engine is unavailable.\n' >&2
            exit 1
          fi

          SIZE_BYTES="$(blockdev --getsize64 "${DEVICE}")"
          SEQ_SIZE_BYTES="$((SIZE_BYTES / 1048576 * 1048576))"
          RAND_SIZE_BYTES="$((SIZE_BYTES / 4096 * 4096))"

          printf 'Userspace: %s\n' "$(cat /etc/redhat-release)"
          printf 'Kernel:    %s\n' "$(uname -r)"
          printf 'fio:       %s\n' "$(fio --version)"
          printf 'Device:    %s (%s bytes)\n' "${DEVICE}" "${SIZE_BYTES}"
          printf 'Runtime:   %ss per workload, queue depth %s\n' "${BENCHMARK_RUNTIME}" "${IO_DEPTH}"

          if (( SEQ_SIZE_BYTES < 1048576 || RAND_SIZE_BYTES < 4096 )); then
            printf 'ERROR: block device is too small for the benchmark.\n' >&2
            exit 1
          fi

          run_fio() {
            local label="$1"
            local outfile="$2"
            shift 2
            printf '\n=== %s ===\n' "${label}"
            fio \
              --filename="${DEVICE}" \
              --allow_file_create=0 \
              --ioengine=libaio \
              --direct=1 \
              --iodepth="${IO_DEPTH}" \
              --numjobs=1 \
              --time_based=1 \
              --runtime="${BENCHMARK_RUNTIME}" \
              --group_reporting \
              --eta=never \
              "$@" | tee "${outfile}"
          }

          run_fio \
            '1/4 Sequential WRITE - 1 MiB' \
            /tmp/fio-seq-write.txt \
            --name=seq-write \
            --rw=write \
            --bs=1M \
            --size="${SEQ_SIZE_BYTES}" \
            --end_fsync=1

          run_fio \
            '2/4 Sequential READ - 1 MiB' \
            /tmp/fio-seq-read.txt \
            --name=seq-read \
            --rw=read \
            --bs=1M \
            --size="${SEQ_SIZE_BYTES}"

          run_fio \
            '3/4 Random WRITE - 4 KiB' \
            /tmp/fio-rand-write.txt \
            --name=rand-write \
            --rw=randwrite \
            --bs=4k \
            --size="${RAND_SIZE_BYTES}" \
            --end_fsync=1

          run_fio \
            '4/4 Random READ - 4 KiB' \
            /tmp/fio-rand-read.txt \
            --name=rand-read \
            --rw=randread \
            --bs=4k \
            --size="${RAND_SIZE_BYTES}"

          printf '\nBenchmark complete. Results: /tmp/fio-*.txt\n'
          sleep infinity
      securityContext:
        privileged: true
        runAsUser: 0
      volumeDevices:
        - name: disk
          devicePath: /dev/rds-test
  volumes:
    - name: disk
      persistentVolumeClaim:
        claimName: rds-csi-test
