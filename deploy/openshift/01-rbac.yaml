apiVersion: v1
kind: ServiceAccount
metadata:
  name: mikrotik-rds-csi-controller
  namespace: mikrotik-rds-csi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mikrotik-rds-csi-node
  namespace: mikrotik-rds-csi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mikrotik-rds-csi-provisioner
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses", "csinodes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: mikrotik-rds-csi-provisioner
subjects:
  - kind: ServiceAccount
    name: mikrotik-rds-csi-controller
    namespace: mikrotik-rds-csi
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: mikrotik-rds-csi-provisioner
---
# OpenShift-specific: allow only the node service account to use the
# built-in privileged SCC. The node plugin needs host /dev, /sys,
# /var/lib/kubelet and mount/NVMe operations.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: use-privileged-scc
  namespace: mikrotik-rds-csi
rules:
  - apiGroups: ["security.openshift.io"]
    resources: ["securitycontextconstraints"]
    resourceNames: ["privileged"]
    verbs: ["use"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mikrotik-rds-csi-node-privileged
  namespace: mikrotik-rds-csi
subjects:
  - kind: ServiceAccount
    name: mikrotik-rds-csi-node
    namespace: mikrotik-rds-csi
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: use-privileged-scc
